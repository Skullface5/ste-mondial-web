<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Mondial Perfume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#2B1D12;color:#F5F0E6;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:520px}
.code{font-size:clamp(96px,22vw,160px);font-weight:300;letter-spacing:.08em;color:#B08D4A;line-height:1}
.msg{margin-top:18px;font-size:17px;font-weight:400;color:#F5F0E6}
.btn{display:inline-block;margin-top:32px;padding:14px 36px;background:#B08D4A;color:#2B1D12;text-decoration:none;font-weight:500;font-size:15px;letter-spacing:.05em;border-radius:4px;transition:opacity .2s}
.btn:hover{opacity:.85}
.alt{margin-top:22px;font-size:13px;font-weight:300}
.alt a{color:#B08D4A;text-decoration:none;margin:0 10px}
.alt a:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="wrap">
<div class="code">404</div>
<p class="msg" id="nfMsg">Page introuvable — Cette page n'existe pas ou a été déplacée.</p>
<a class="btn" id="nfCta" href="/">Retour à la boutique</a>
<p class="alt" id="nfAlt" hidden></p>
</main>
<script>
/* Trilingual 404. Reads the shop's own language choice (localStorage sm_lang2,
   written by js/app2.js), a ?lang= query parameter, or the browser language -
   in that order - so a visitor who was browsing in Arabic stays in Arabic. */
(function () {
  var STR = {
    fr: { title: 'Page introuvable — Mondial Perfume',
          msg: "Page introuvable — Cette page n'existe pas ou a été déplacée.",
          cta: 'Retour à la boutique', back: 'Retour à la boutique' },
    en: { title: 'Page not found — Mondial Perfume',
          msg: 'Page not found — This page does not exist or has been moved.',
          cta: 'Back to the shop', back: 'Back to the shop' },
    ar: { title: 'الصفحة غير موجودة — مونديال برفوم',
          msg: 'الصفحة غير موجودة — هذه الصفحة غير متوفرة أو تم نقلها.',
          cta: 'العودة إلى المتجر', back: 'العودة إلى المتجر' }
  };
  var lang = null;
  try {
    var q = (location.search.match(/[?&]lang=(fr|en|ar)(?:&|$)/) || [])[1];
    if (q) lang = q;
    if (!lang) { var s = localStorage.getItem('sm_lang2'); if (s && STR[s]) lang = s; }
  } catch (e) { /* private mode */ }
  if (!lang) {
    var nav = (navigator.language || 'fr').slice(0, 2);
    lang = (nav === 'ar' || nav === 'en') ? nav : 'fr';
  }
  var t = STR[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.title;
  var msg = document.getElementById('nfMsg'); if (msg) msg.textContent = t.msg;
  var cta = document.getElementById('nfCta'); if (cta) cta.textContent = t.cta;
  var alt = document.getElementById('nfAlt');
  if (alt) {
    alt.innerHTML = ['fr', 'en', 'ar'].filter(function (x) { return x !== lang; })
      .map(function (x) { return '<a href="/?lang=' + x + '" lang="' + x + '">' + STR[x].back + '</a>'; })
      .join('·');
    alt.hidden = false;
  }
})();
</script>
</body>
</html>
